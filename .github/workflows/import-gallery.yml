name: Import verified gallery images for site upgrade

on:
  push:
    branches: [sync-test-to-production-2026-11-21]

permissions:
  contents: write

jobs:
  import-gallery:
    if: github.event.head_commit.message == 'Stage SOLCHI production site sync with verified content'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download only source-verified gallery images
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import urllib.parse
          import urllib.request
          files = {
            "public/future-images/substation_05_web.png": "ab520de448059576da49d5ed2eb601ceac89791a",
            "public/future-images/Galvanized Substation Workshop with Overhead Crane.png": "ac58990c9c77f9bda222036bff10d954c93f958e",
            "public/future-images/Industrial Switchgear and Safety Lift.png": "bc83eb66fc130506eaf1ea7821d91519122be624",
            "public/future-images/Polished High-Voltage Equipment Hall.png": "bf25c00db4f64bf68c26c1af57a368089abcd5a1",
            "public/future-images/Bird’s-Eye View of Industrial Electrical Room.png": "c0943631cb8d5e6b10699b4f05611ee9e021c693",
          }
          for name, expected in files.items():
              url = "https://solchi-website-copy.vercel.app/" + urllib.parse.quote(name.removeprefix("public/"))
              request = urllib.request.Request(url, headers={"User-Agent": "SolchiGallerySync/1.0"})
              with urllib.request.urlopen(request, timeout=45) as response:
                  content = response.read()
              actual = hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest()
              if actual != expected:
                  raise SystemExit(f"Unexpected content for {name}: got {actual}")
              p = pathlib.Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(content)
              print(f"Validated {name} ({len(content)} bytes)")
          PY
      - name: Commit verified assets on staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/future-images/
          git commit -m "Import verified SOLCHI gallery assets" 
          git push origin HEAD:sync-test-to-production-2026-11-21
